events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream bestar_public_ingress { server nginx:8080; }

  server {
    listen 443 ssl;
    server_name public-edge-emulator;
    ssl_certificate /etc/nginx/test-tls/tls.crt;
    ssl_certificate_key /etc/nginx/test-tls/tls.key;

    location / {
      proxy_pass http://bestar_public_ingress;
      proxy_http_version 1.1;
      proxy_set_header Host public-edge-emulator;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header CF-Connecting-IP 198.51.100.42;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
